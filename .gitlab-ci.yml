stages:
  - build
  - deploy

default:
  image: docker:27.5.1
  services:
    - name: docker:27.5.1-dind

variables:
  DOCKER_HOST: tcp://docker:2376
  DOCKER_TLS_CERTDIR: "/certs"
  DOCKER_TLS_VERIFY: "1"
  DOCKER_CERT_PATH: "$DOCKER_TLS_CERTDIR/client"
  DOCKER_DRIVER: overlay2
  DOCKER_BUILDKIT: "1"

publish_image:
  stage: build
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - |
      set -euo pipefail

      IMAGE_SHA="${CI_REGISTRY_IMAGE}:sha-${CI_COMMIT_SHORT_SHA}"
      docker build --pull -t "$IMAGE_SHA" .
      docker push "$IMAGE_SHA"

      if [ "${CI_COMMIT_BRANCH:-}" = "$CI_DEFAULT_BRANCH" ]; then
        docker tag "$IMAGE_SHA" "${CI_REGISTRY_IMAGE}:latest"
        docker push "${CI_REGISTRY_IMAGE}:latest"
      fi

      if [ -n "${CI_COMMIT_TAG:-}" ]; then
        docker tag "$IMAGE_SHA" "${CI_REGISTRY_IMAGE}:${CI_COMMIT_TAG}"
        docker push "${CI_REGISTRY_IMAGE}:${CI_COMMIT_TAG}"
      fi

  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG'
    - when: manual

deploy_vps:
  stage: deploy
  image: alpine:3.21
  services: []
  variables:
    GIT_STRATEGY: none
  before_script:
    - 'test -n "$VPS_HOST" || (echo "Missing CI/CD variable VPS_HOST" >&2; exit 1)'
    - 'test -n "$VPS_USER" || (echo "Missing CI/CD variable VPS_USER" >&2; exit 1)'
    - 'test -n "$VPS_SSH_PRIVATE_KEY" || (echo "Missing CI/CD variable VPS_SSH_PRIVATE_KEY" >&2; exit 1)'
    - apk add --no-cache openssh-client
    - eval "$(ssh-agent -s)"
    - printf "%s\n" "$VPS_SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - install -m 700 -d ~/.ssh
    - |
      if [ -n "${VPS_KNOWN_HOSTS:-}" ]; then
        printf "%s\n" "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
      else
        ssh-keyscan -p "${VPS_PORT:-22}" -H "$VPS_HOST" > ~/.ssh/known_hosts
      fi
    - chmod 600 ~/.ssh/known_hosts
  script:
    - |
      set -euo pipefail

      PORT="${VPS_PORT:-22}"
      APP_PATH="${VPS_APP_PATH:-/opt/jetllm}"
      JETLLM_IMAGE="${CI_REGISTRY_IMAGE}:latest"
      REGISTRY_HOST="${CI_REGISTRY}"
      REGISTRY_USER="${VPS_REGISTRY_USER:-}"
      REGISTRY_PASSWORD_B64=""

      if [ -n "${VPS_REGISTRY_PASSWORD:-}" ]; then
        REGISTRY_PASSWORD_B64="$(printf '%s' "$VPS_REGISTRY_PASSWORD" | base64 | tr -d '\n')"
      fi

      ssh -p "$PORT" "$VPS_USER@$VPS_HOST" \
        "APP_PATH='$APP_PATH' JETLLM_IMAGE='$JETLLM_IMAGE' REGISTRY_HOST='$REGISTRY_HOST' REGISTRY_USER='$REGISTRY_USER' REGISTRY_PASSWORD_B64='$REGISTRY_PASSWORD_B64' sh -s" <<'EOSSH'
      set -eu

      cd "$APP_PATH"

      if [ -n "${REGISTRY_USER:-}" ] && [ -n "${REGISTRY_PASSWORD_B64:-}" ]; then
        printf '%s' "$REGISTRY_PASSWORD_B64" | base64 -d | docker login "$REGISTRY_HOST" -u "$REGISTRY_USER" --password-stdin
      fi

      if [ ! -f .env.deploy ]; then
        if [ -f .env.deploy.example ]; then
          cp .env.deploy.example .env.deploy
        else
          : > .env.deploy
        fi
      fi

      JETLLM_IMAGE="$JETLLM_IMAGE" docker compose -f docker-compose.deploy.yml --env-file .env.deploy pull
      JETLLM_IMAGE="$JETLLM_IMAGE" docker compose -f docker-compose.deploy.yml --env-file .env.deploy up -d
      docker image prune -f
      JETLLM_IMAGE="$JETLLM_IMAGE" docker compose -f docker-compose.deploy.yml --env-file .env.deploy ps
      EOSSH
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
