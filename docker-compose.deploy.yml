services:
  jetllm:
    image: ${JETLLM_IMAGE:?Set JETLLM_IMAGE in .env.deploy}
    pull_policy: always
    ports:
      - "${JETLLM_PORT:-3000}:3000"
    volumes:
      - jetllm-data:/app/data
    environment:
      - DB_PATH=/app/data/jetllm.db
    restart: unless-stopped

volumes:
  jetllm-data:
