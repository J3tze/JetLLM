name: Auto Deploy VPS

on:
  workflow_run:
    workflows:
      - Publish Docker Image
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vps-auto-deploy
  cancel-in-progress: true

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'master'
      )
    runs-on: ubuntu-latest
    steps:
      - name: Validate deploy secrets
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          [ -n "${VPS_HOST:-}" ] || { echo "Missing secret: VPS_HOST" >&2; exit 1; }
          [ -n "${VPS_USER:-}" ] || { echo "Missing secret: VPS_USER" >&2; exit 1; }
          [ -n "${VPS_SSH_KEY:-}" ] || { echo "Missing secret: VPS_SSH_KEY" >&2; exit 1; }

      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf "%s\n" "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          if [ -n "${VPS_KNOWN_HOSTS:-}" ]; then
            printf "%s\n" "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            PORT="${VPS_PORT:-22}"
            ssh-keyscan -p "$PORT" "$VPS_HOST" > ~/.ssh/known_hosts
          fi

          chmod 600 ~/.ssh/known_hosts

      - name: Deploy latest image on VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_APP_PATH: ${{ vars.VPS_APP_PATH }}
        run: |
          set -euo pipefail
          PORT="${VPS_PORT:-22}"
          APP_PATH="${VPS_APP_PATH:-/opt/jetllm}"

          ssh -p "$PORT" "$VPS_USER@$VPS_HOST" "bash -se" <<EOF
          set -euo pipefail
          cd "$APP_PATH"
          docker compose -f docker-compose.deploy.yml --env-file .env.deploy pull
          docker compose -f docker-compose.deploy.yml --env-file .env.deploy up -d
          docker image prune -f
          docker compose -f docker-compose.deploy.yml --env-file .env.deploy ps
          EOF
